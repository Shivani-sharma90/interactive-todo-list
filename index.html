
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>My To-Do List</h1>
    <p>Plan your day, one task at a time!</p>

    <form id="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Enter a new task..."
        required
      >
      <button type="submit">Add Task</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="done">Done</button>
    </nav>

    <ul id="task-list"></ul>

    <p class="note">Your tasks are saved in this browser.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
